spring.application.name=partner_service
server.servlet.context-path=/
server.port=8090

spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.datasource.url=${SECRETS_DB_URL:jdbc:mariadb://192.168.0.125:3306/e_voucher}
spring.datasource.username= ${SECRETS_DB_USERNAME:castis}
spring.datasource.password= ${SECRETS_DB_PASSWORD:castis}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.show_sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.mvc.pathmatch.matching-strategy=ant_path_matcher
spring.jackson.time-zone=Asia/Ho_Chi_Minh

log.home=/castis/bin/partner-service/logs

partner.vnpt.default.uri=http://itopup-test.megapay.net.vn:8082/CDV_Partner_Services/services/Interfaces
partner.vnpt.partner.name=partnerTest
partner.vnpt.private-
partner.vnpt.card.key=123456abc


logging.level.com.com.evoucher.partner.service=INFO
logging.level.org.springframework.ws=INFO

springfox.documentation.enabled=true
springfox.documentation.open-api.enabled=true