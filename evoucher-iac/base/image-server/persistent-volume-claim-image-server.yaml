apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: image-server-pvc
  namespace: production
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: standard
  resources:
    requests:
      storage: 200Gi
  selector:
    matchLabels:
      app: image-server  # Match the label used in the PV
