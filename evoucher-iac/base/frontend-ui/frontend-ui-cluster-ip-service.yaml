apiVersion: v1
kind: Service
metadata:
  name: frontend-ui-cluster-ip-service
  namespace: production
spec:
  selector:
    app: frontend-ui
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80 # Replace this with the port your pod is listening on
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 30
