# In Queue
#queue.in.name=send_voucher
#queue.in.exchange=direct_exchange
#queue.in.routingKey=send_voucher

queue.in.name=SEND_VOUCHER
queue.in.exchange=direct_exchange
queue.in.routingKey=send_voucher
queue.in.duable=true

# Out Queue
queue.out.name=SEND_MESSAGE_RESULT
queue.out.exchange=direct_exchange
queue.out.routingKey=send_message_result
queue.out.duable=true

# DLQ Queue
queue.dlq.name=${queue.in.name}.DLQ
queue.dlq.exchange=${queue.in.exchange}.dlx
queue.dlq.routeKey=${queue.in.routingKey}.dlq
