server:
  servlet:
    context-path: /
  port: 8080

spring:
  application:
    name: admin-api
  datasource:
    url: ${SECRETS_DB_URL:jdbc:mariadb://localhost:3306/e_voucher}
    username: ${SECRETS_DB_USERNAME:castis}
    password: ${SECRETS_DB_PASSWORD:castis}
    driver-class-name: org.mariadb.jdbc.Driver
  jpa:
    properties:
      hibernate:
        show_sql: false
        format_sql: false
  convertor:
    key: ${DATABASE_CONVERTOR_KEY:XaYbCz3579CzXaYb0246813579aBcDeF}
  jackson:
    time-zone: Asia/Ho_Chi_Minh
  redis:
    host: ${SECRETS_REDIS_HOST:127.0.0.1}
    port: ${SECRETS_REDIS_PORT:6379}
    timeout: 60000
    jedis:
      pool:
        max-active: 100
        max-wait: -1ms
        min-idle: 10
        max-idle: 30

auth:
  secret: ${AUTH_SECRET_KEY:1234567890}
  expirationTime: ${AUTH_EXPIRE_TIME:86400000}

servers:
  publishServer: ${PUBLISH_SERVER_URL:http://localhost:8083}
  evoucherServiceBe: ${EVOUCHER_SERVICE_BE_SERVER_URL:http://localhost:8083/}

springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false


e-voucher:
  service-be:
    url: http://192.168.0.125:8083

vnpt-epay:
  supplier-id: 1234567895

gift-pop:
  authentication-key: ${GIFT_POP_AUTH_KEY}
  url: ${GIFT_POP_URL}

feign:
  client:
    config:
      default:
        connectTimeout: 120000
        readTimeout: 120000
rest-template:
  connectTime: 120000
  readTimeout: 120000