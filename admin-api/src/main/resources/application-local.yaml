server:
  servlet:
    context-path: /
  port: 8080
  tomcat:
    relaxed-path-chars: <,>,[,\,],^,`,{,|,}
    relaxed-query-chars: <,>,[,\,],^,`,{,|,}

spring:
  application:
    name: admin-api
  datasource:
    #    url: ${SECRETS_DB_URL:jdbc:mariadb://192.168.0.125:3306/e_voucher}
    url: ${SECRETS_DB_URL:jdbc:mariadb://192.168.0.125:3306/e_voucher_clone}
    username: ${SECRETS_DB_USERNAME:castis}
    password: ${SECRETS_DB_PASSWORD:castis}
    driver-class-name: org.mariadb.jdbc.Driver
  jpa:
    properties:
      hibernate:
        show_sql: true
        format_sql: true
  #        hbm2ddl:
  #          auto: update
  convertor:
    key: ${DATABASE_CONVERTOR_KEY:XaYbCz3579CzXaYb0246813579aBcDeF}
  jackson:
    time-zone=: Asia/Ho_Chi_Minh
  redis:
    host: ${SECRETS_REDIS_HOST:192.168.0.125}
    port: ${SECRETS_REDIS_PORT:6379}
    standalone: true
    timeout: 60000
    jedis:
      pool:
        max-active: 100
        max-wait: -1ms
        min-idle: 10
        max-idle: 30

auth:
  secret: ${AUTH_SECRET_KEY:1234567890}
  expirationTime: ${AUTH_EXPIRE_TIME:86400000}

