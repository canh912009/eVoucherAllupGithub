# ============================================================
# Prometheus ConfigMap
# Chứa cấu hình chính của Prometheus server:
# - Alerting rules: định nghĩa các rule cảnh báo
# - Scrape configs: cấu hình thu thập metrics từ các target
# ============================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-server-conf
  labels:
    name: prometheus-server-conf
  namespace: monitoring
data:
  # --- Alert Rules ---
  # File rules chứa các cảnh báo tự động
  prometheus.rules: |-
    groups:
    - name: devopscube demo alert
      rules:
      - alert: High Pod Memory
        expr: sum(container_memory_usage_bytes) > 1
        for: 1m
        labels:
          severity: slack
        annotations:
          summary: High Memory Usage

  # --- Prometheus Main Config ---
  prometheus.yml: |-
    global:
      # scrape_interval: khoảng thời gian giữa mỗi lần Prometheus
      # thu thập (scrape) metrics từ các target. 5s = mỗi 5 giây.
      # Giá trị nhỏ → dữ liệu chi tiết hơn nhưng tốn tài nguyên hơn.
      scrape_interval: 5s
      # evaluation_interval: khoảng thời gian đánh giá alert rules
      evaluation_interval: 5s

    # Đường dẫn đến file alert rules
    rule_files:
      - /etc/prometheus/prometheus.rules

    # --- Scrape Configs ---
    # Danh sách các job thu thập metrics từ các nguồn khác nhau
    scrape_configs:

      # ---- Job: node-exporter-db ----
      # Thu thập metrics hệ thống (CPU, memory, disk, network)
      # từ các máy chủ database/server BÊN NGOÀI Kubernetes cluster.
      # Các IP này là node-exporter chạy trực tiếp trên máy vật lý.
      - job_name: 'node-exporter-db'
        static_configs:
          - targets:
              - '192.168.23.101:9100'  # Node-exporter bên ngoài cluster (DB server 1)
              - '192.168.23.102:9100'  # Node-exporter bên ngoài cluster (DB server 2)
              - '192.168.23.103:9100'  # Node-exporter bên ngoài cluster (DB server 3)
        relabel_configs:
          - source_labels: [__address__]
            target_label: instance

      # ---- Job: node-exporter ----
      # Thu thập metrics CPU, memory, disk từ MỖI node trong K8s cluster.
      # Sử dụng Kubernetes service discovery (endpoints) để tự động
      # tìm các node-exporter pods (DaemonSet chạy trên mỗi node).
      - job_name: 'node-exporter'
        kubernetes_sd_configs:
          - role: endpoints
        relabel_configs:
          - source_labels: [__meta_kubernetes_endpoints_name]
            regex: 'node-exporter'
            action: keep  # Chỉ giữ lại endpoints có tên "node-exporter"

      # ---- Job: kubernetes-apiservers ----
      # Giám sát Kubernetes API Server — thành phần trung tâm của cluster.
      # Thu thập: request latency, request count, error rate.
      # Giúp phát hiện sớm vấn đề về hiệu năng hoặc lỗi API.
      - job_name: 'kubernetes-apiservers'
        kubernetes_sd_configs:
          - role: endpoints
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        relabel_configs:
          - source_labels: [__meta_kubernetes_namespace, __meta_kubernetes_service_name, __meta_kubernetes_endpoint_port_name]
            action: keep
            regex: default;kubernetes;https  # Chỉ scrape API server endpoint

      # ---- Job: kubernetes-nodes ----
      # Thu thập metrics từ kubelet trên mỗi node.
      # Kubelet quản lý pods trên node → metrics về container lifecycle,
      # volume operations, runtime operations.
      - job_name: 'kubernetes-nodes'
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - action: labelmap
            regex: __meta_kubernetes_node_label_(.+)
          - target_label: __address__
            replacement: kubernetes.default.svc:443
          - source_labels: [__meta_kubernetes_node_name]
            regex: (.+)
            target_label: __metrics_path__
            replacement: /api/v1/nodes/${1}/proxy/metrics

      # ---- Job: kube-state-metrics ----
      # Thu thập trạng thái của các Kubernetes objects:
      # - Pod: running, pending, failed, restart count
      # - Deployment: desired vs available replicas
      # - Node: conditions (ready, memory pressure, disk pressure)
      # Khác với node-exporter (hardware metrics), kube-state-metrics
      # cung cấp thông tin về trạng thái logic của K8s resources.
      - job_name: 'kube-state-metrics'
        kubernetes_sd_configs:
          - role: endpoints
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_name]
            regex: 'kube-state-metrics'
            action: keep

      # ---- Job: kubernetes-cadvisor ----
      # cAdvisor (Container Advisor) thu thập CPU/memory usage
      # của TỪNG container trong mỗi pod.
      # Dữ liệu này giúp: thiết lập resources limits, phát hiện
      # memory leak, tối ưu hóa tài nguyên cho ứng dụng.
      - job_name: 'kubernetes-cadvisor'
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - action: labelmap
            regex: __meta_kubernetes_node_label_(.+)
          - target_label: __address__
            replacement: kubernetes.default.svc:443
          - source_labels: [__meta_kubernetes_node_name]
            regex: (.+)
            target_label: __metrics_path__
            replacement: /api/v1/nodes/${1}/proxy/metrics/cadvisor
