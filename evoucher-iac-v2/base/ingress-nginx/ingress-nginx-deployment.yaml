# ============================================================
# NGINX Ingress Controller
# Ingress Controller là thành phần trung gian giữa traffic bên ngoài
# và các services bên trong cluster. Nó đọc Ingress resources và
# tự động cấu hình NGINX để route traffic đến đúng service.
#
# Flow: Client → NodePort (30080/30443) → Ingress Controller → Service → Pod
# ============================================================

# --- Namespace ---
# Tạo namespace riêng cho Ingress Controller, tách biệt với
# ứng dụng để dễ quản lý và phân quyền
apiVersion: v1
kind: Namespace
metadata:
  labels:
    app.kubernetes.io/instance: ingress-nginx
    app.kubernetes.io/name: ingress-nginx
  name: ingress-nginx

---
# --- ServiceAccount cho Controller ---
# ServiceAccount riêng cho Ingress Controller pod, cho phép
# gán quyền RBAC cụ thể để đọc ingress, services, secrets
apiVersion: v1
automountServiceAccountToken: true
kind: ServiceAccount
metadata:
  labels:
    app.kubernetes.io/component: controller
    app.kubernetes.io/instance: ingress-nginx
    app.kubernetes.io/name: ingress-nginx
    app.kubernetes.io/part-of: ingress-nginx
    app.kubernetes.io/version: 1.8.1
  name: ingress-nginx
  namespace: ingress-nginx

---
# --- ServiceAccount cho Admission Webhook ---
# ServiceAccount riêng cho webhook jobs (tạo TLS certificate)
apiVersion: v1
kind: ServiceAccount
metadata:
  labels:
    app.kubernetes.io/component: admission-webhook
    app.kubernetes.io/instance: ingress-nginx
    app.kubernetes.io/name: ingress-nginx
    app.kubernetes.io/part-of: ingress-nginx
    app.kubernetes.io/version: 1.8.1
  name: ingress-nginx-admission
  namespace: ingress-nginx

---
# --- Role (namespace-scoped) cho Controller ---
# Quyền trong namespace ingress-nginx:
# - Đọc configmaps, pods, secrets, endpoints, services
# - Quản lý leader election (coordination.k8s.io/leases)
# - Tạo events để ghi log hoạt động
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  labels:
    app.kubernetes.io/component: controller
    app.kubernetes.io/instance: ingress-nginx
    app.kubernetes.io/name: ingress-nginx
    app.kubernetes.io/part-of: ingress-nginx
    app.kubernetes.io/version: 1.8.1
  name: ingress-nginx
  namespace: ingress-nginx
rules:
  # Đọc namespace hiện tại
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [get]
  # Đọc configmaps, pods, secrets, endpoints — cần để load cấu hình
  # và phát hiện backend services
  - apiGroups: [""]
    resources: [configmaps, pods, secrets, endpoints]
    verbs: [get, list, watch]
  # Đọc services — cần để route traffic đến đúng backend
  - apiGroups: [""]
    resources: [services]
    verbs: [get, list, watch]
  # Đọc ingress resources — cấu hình routing rules
  - apiGroups: [networking.k8s.io]
    resources: [ingresses]
    verbs: [get, list, watch]
  # Cập nhật trạng thái ingress (ghi IP address vào status)
  - apiGroups: [networking.k8s.io]
    resources: [ingresses/status]
    verbs: [update]
  # Đọc IngressClass — xác định controller nào xử lý ingress nào
  - apiGroups: [networking.k8s.io]
    resources: [ingressclasses]
    verbs: [get, list, watch]
  # Leader election: đảm bảo chỉ 1 controller active xử lý ingress
  - apiGroups: [coordination.k8s.io]
    resourceNames: [ingress-nginx-leader]
    resources: [leases]
    verbs: [get, update]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [create]
  # Tạo events để ghi log hoạt động (ingress created, updated, etc.)
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]
  # Đọc EndpointSlices — phiên bản mới của Endpoints API
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [list, watch, get]

---
# --- Role cho Admission Webhook ---
# Webhook cần quyền đọc và tạo secrets (TLS certificate)
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  labels:
    app.kubernetes.io/component: admission-webhook
    app.kubernetes.io/instance: ingress-nginx
    app.kubernetes.io/name: ingress-nginx
    app.kubernetes.io/part-of: ingress-nginx
    app.kubernetes.io/version: 1.8.1
  name: ingress-nginx-admission
  namespace: ingress-nginx
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, create]

---
# --- ClusterRole cho Controller ---
# Quyền ở cấp cluster (cross-namespace):
# Controller cần đọc ingress, services, endpoints từ TẤT CẢ namespaces
# để route traffic cho mọi ứng dụng trong cluster
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/instance: ingress-nginx
    app.kubernetes.io/name: ingress-nginx
    app.kubernetes.io/part-of: ingress-nginx
    app.kubernetes.io/version: 1.8.1
  name: ingress-nginx
rules:
  # Đọc configmaps, endpoints, nodes, pods, secrets, namespaces
  # từ tất cả namespaces để phát hiện và route traffic
  - apiGroups: [""]
    resources: [configmaps, endpoints, nodes, pods, secrets, namespaces]
    verbs: [list, watch]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [list, watch]
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get]
  # Đọc services — backend cho ingress rules
  - apiGroups: [""]
    resources: [services]
    verbs: [get, list, watch]
  # Đọc ingress resources từ tất cả namespaces
  - apiGroups: [networking.k8s.io]
    resources: [ingresses]
    verbs: [get, list, watch]
  # Tạo events
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]
  # Cập nhật status cho ingress resources
  - apiGroups: [networking.k8s.io]
    resources: [ingresses/status]
    verbs: [update]
  # Đọc IngressClass
  - apiGroups: [networking.k8s.io]
    resources: [ingressclasses]
    verbs: [get, list, watch]
  # Đọc EndpointSlices
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [list, watch, get]

---
# --- ClusterRole cho Admission Webhook ---
# Webhook cần quyền cập nhật ValidatingWebhookConfiguration
# (đăng ký CA bundle để Kubernetes API server tin tưởng webhook)
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/component: admission-webhook
    app.kubernetes.io/instance: ingress-nginx
    app.kubernetes.io/name: ingress-nginx
    app.kubernetes.io/part-of: ingress-nginx
    app.kubernetes.io/version: 1.8.1
  name: ingress-nginx-admission
rules:
  - apiGroups: [admissionregistration.k8s.io]
    resources: [validatingwebhookconfigurations]
    verbs: [get, update]

---
# --- RoleBinding cho Controller ---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  labels:
    app.kubernetes.io/component: controller
    app.kubernetes.io/instance: ingress-nginx
    app.kubernetes.io/name: ingress-nginx
    app.kubernetes.io/part-of: ingress-nginx
    app.kubernetes.io/version: 1.8.1
  name: ingress-nginx
  namespace: ingress-nginx
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ingress-nginx
subjects:
  - kind: ServiceAccount
    name: ingress-nginx
    namespace: ingress-nginx

---
# --- RoleBinding cho Admission Webhook ---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  labels:
    app.kubernetes.io/component: admission-webhook
    app.kubernetes.io/instance: ingress-nginx
    app.kubernetes.io/name: ingress-nginx
    app.kubernetes.io/part-of: ingress-nginx
    app.kubernetes.io/version: 1.8.1
  name: ingress-nginx-admission
  namespace: ingress-nginx
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ingress-nginx-admission
subjects:
  - kind: ServiceAccount
    name: ingress-nginx-admission
    namespace: ingress-nginx

---
# --- ClusterRoleBinding cho Controller ---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  labels:
    app.kubernetes.io/instance: ingress-nginx
    app.kubernetes.io/name: ingress-nginx
    app.kubernetes.io/part-of: ingress-nginx
    app.kubernetes.io/version: 1.8.1
  name: ingress-nginx
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ingress-nginx
subjects:
  - kind: ServiceAccount
    name: ingress-nginx
    namespace: ingress-nginx

---
# --- ClusterRoleBinding cho Admission Webhook ---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  labels:
    app.kubernetes.io/component: admission-webhook
    app.kubernetes.io/instance: ingress-nginx
    app.kubernetes.io/name: ingress-nginx
    app.kubernetes.io/part-of: ingress-nginx
    app.kubernetes.io/version: 1.8.1
  name: ingress-nginx-admission
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ingress-nginx-admission
subjects:
  - kind: ServiceAccount
    name: ingress-nginx-admission
    namespace: ingress-nginx

---
# --- ConfigMap cho Controller ---
# Cấu hình toàn cục cho NGINX Ingress Controller.
# allow-snippet-annotations: cho phép dùng custom nginx snippets
# trong Ingress annotations (ví dụ: thêm custom headers, rewrites)
apiVersion: v1
data:
  allow-snippet-annotations: "true"
kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/component: controller
    app.kubernetes.io/instance: ingress-nginx
    app.kubernetes.io/name: ingress-nginx
    app.kubernetes.io/part-of: ingress-nginx
    app.kubernetes.io/version: 1.8.1
  name: ingress-nginx-controller
  namespace: ingress-nginx

---
# --- Service NodePort cho Controller ---
# Expose Ingress Controller ra bên ngoài cluster qua NodePort.
# Traffic từ load balancer / reverse proxy bên ngoài sẽ vào qua:
# - Port 30080 (HTTP) → container port 80
# - Port 30443 (HTTPS) → container port 443
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/component: controller
    app.kubernetes.io/instance: ingress-nginx
    app.kubernetes.io/name: ingress-nginx
    app.kubernetes.io/part-of: ingress-nginx
    app.kubernetes.io/version: 1.8.1
  name: ingress-nginx-controller
  namespace: ingress-nginx
spec:
  ipFamilies:
    - IPv4
  ipFamilyPolicy: SingleStack
  ports:
    - appProtocol: http
      name: http
      port: 80
      protocol: TCP
      targetPort: http
      nodePort: 30080  # Port trên mỗi node cho HTTP traffic
    - appProtocol: https
      name: https
      port: 443
      protocol: TCP
      targetPort: https
      nodePort: 30443  # Port trên mỗi node cho HTTPS traffic
  selector:
    app.kubernetes.io/component: controller
    app.kubernetes.io/instance: ingress-nginx
    app.kubernetes.io/name: ingress-nginx
  type: NodePort  # Expose trên mỗi node qua static port

---
# --- Service cho Admission Webhook ---
# ClusterIP service cho webhook — chỉ dùng nội bộ cluster.
# Kubernetes API server gọi đến webhook này để validate Ingress
# resources trước khi apply (kiểm tra cú pháp, cấu hình hợp lệ).
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/component: controller
    app.kubernetes.io/instance: ingress-nginx
    app.kubernetes.io/name: ingress-nginx
    app.kubernetes.io/part-of: ingress-nginx
    app.kubernetes.io/version: 1.8.1
  name: ingress-nginx-controller-admission
  namespace: ingress-nginx
spec:
  ports:
    - appProtocol: https
      name: https-webhook
      port: 443
      targetPort: webhook
  selector:
    app.kubernetes.io/component: controller
    app.kubernetes.io/instance: ingress-nginx
    app.kubernetes.io/name: ingress-nginx
  type: ClusterIP

---
# --- DaemonSet cho Controller ---
# Sử dụng DaemonSet thay vì Deployment để chạy controller trên
# MỌI node → đảm bảo High Availability (HA).
# Traffic vào bất kỳ node nào qua NodePort đều được xử lý ngay
# mà không cần forward qua node khác.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  labels:
    app.kubernetes.io/component: controller
    app.kubernetes.io/instance: ingress-nginx
    app.kubernetes.io/name: ingress-nginx
    app.kubernetes.io/part-of: ingress-nginx
    app.kubernetes.io/version: 1.8.1
  name: ingress-nginx-controller
  namespace: ingress-nginx
spec:
  minReadySeconds: 0
  revisionHistoryLimit: 10  # Giữ lại 10 phiên bản DaemonSet cũ để rollback
  selector:
    matchLabels:
      app.kubernetes.io/component: controller
      app.kubernetes.io/instance: ingress-nginx
      app.kubernetes.io/name: ingress-nginx
  template:
    metadata:
      labels:
        app.kubernetes.io/component: controller
        app.kubernetes.io/instance: ingress-nginx
        app.kubernetes.io/name: ingress-nginx
        app.kubernetes.io/part-of: ingress-nginx
        app.kubernetes.io/version: 1.8.1
    spec:
      containers:
        - args:
            - /nginx-ingress-controller
            # Leader election ID — chỉ 1 controller xử lý ingress tại 1 thời điểm
            - --election-id=ingress-nginx-leader
            # Class name cho controller
            - --controller-class=k8s.io/ingress-nginx
            # Ingress class mà controller này xử lý
            - --ingress-class=nginx
            # ConfigMap chứa cấu hình NGINX global
            - --configmap=$(POD_NAMESPACE)/ingress-nginx-controller
            # Webhook endpoint cho admission validation
            - --validating-webhook=:8443
            - --validating-webhook-certificate=/usr/local/certificates/cert
            - --validating-webhook-key=/usr/local/certificates/key
          env:
            # Tên pod — dùng cho leader election và logging
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            # Namespace pod — dùng để tìm ConfigMap và resources
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            # Sử dụng mimalloc thay malloc — tối ưu memory allocation cho NGINX
            - name: LD_PRELOAD
              value: /usr/local/lib/libmimalloc.so
          image: registry.k8s.io/ingress-nginx/controller:v1.8.1@sha256:e5c4824e7375fcf2a393e1c03c293b69759af37a9ca6abdb91b13d78a93da8bd
          imagePullPolicy: IfNotPresent
          lifecycle:
            preStop:
              exec:
                command:
                  - /wait-shutdown  # Graceful shutdown — chờ connections hiện tại hoàn thành
          # Liveness probe: kiểm tra controller còn hoạt động không
          # Nếu fail 5 lần liên tiếp → Kubernetes restart container
          livenessProbe:
            failureThreshold: 5
            httpGet:
              path: /healthz       # Health check endpoint tích hợp sẵn
              port: 10254          # Port riêng cho health check (không phải traffic port)
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 1
          name: controller
          ports:
            - containerPort: 80    # HTTP traffic
              name: http
              protocol: TCP
            - containerPort: 443   # HTTPS traffic
              name: https
              protocol: TCP
            - containerPort: 8443  # Admission webhook endpoint
              name: webhook
              protocol: TCP
          # Readiness probe: kiểm tra controller sẵn sàng nhận traffic chưa
          # Pod chỉ nhận traffic khi readiness probe thành công
          readinessProbe:
            failureThreshold: 3
            httpGet:
              path: /healthz
              port: 10254
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 1
          resources:
            requests:
              cpu: 100m     # Yêu cầu tối thiểu CPU
              memory: 90Mi  # Yêu cầu tối thiểu RAM
          securityContext:
            allowPrivilegeEscalation: true
            capabilities:
              add:
                - NET_BIND_SERVICE  # Cho phép bind port < 1024 (port 80, 443)
              drop:
                - ALL  # Xóa tất cả capabilities khác (security best practice)
            runAsUser: 101  # Chạy với user non-root (www-data)
          volumeMounts:
            - mountPath: /usr/local/certificates/
              name: webhook-cert
              readOnly: true
      dnsPolicy: ClusterFirst
      nodeSelector:
        kubernetes.io/os: linux  # Chỉ chạy trên Linux nodes
      serviceAccountName: ingress-nginx
      terminationGracePeriodSeconds: 300  # Chờ 5 phút để xử lý nốt connections trước khi shutdown
      volumes:
        - name: webhook-cert
          secret:
            secretName: ingress-nginx-admission  # TLS cert cho webhook

---
# --- Job: Tạo TLS Certificate cho Admission Webhook ---
# Job chạy 1 lần để tạo self-signed TLS certificate
# và lưu vào Secret "ingress-nginx-admission"
apiVersion: batch/v1
kind: Job
metadata:
  labels:
    app.kubernetes.io/component: admission-webhook
    app.kubernetes.io/instance: ingress-nginx
    app.kubernetes.io/name: ingress-nginx
    app.kubernetes.io/part-of: ingress-nginx
    app.kubernetes.io/version: 1.8.1
  name: ingress-nginx-admission-create
  namespace: ingress-nginx
spec:
  template:
    metadata:
      labels:
        app.kubernetes.io/component: admission-webhook
        app.kubernetes.io/instance: ingress-nginx
        app.kubernetes.io/name: ingress-nginx
        app.kubernetes.io/part-of: ingress-nginx
        app.kubernetes.io/version: 1.8.1
      name: ingress-nginx-admission-create
    spec:
      containers:
        - args:
            - create
            - --host=ingress-nginx-controller-admission,ingress-nginx-controller-admission.$(POD_NAMESPACE).svc
            - --namespace=$(POD_NAMESPACE)
            - --secret-name=ingress-nginx-admission
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          image: registry.k8s.io/ingress-nginx/kube-webhook-certgen:v20230407@sha256:543c40fd093964bc9ab509d3e791f9989963021f1e9e4c9c7b6700b02bfb227b
          imagePullPolicy: IfNotPresent
          name: create
          securityContext:
            allowPrivilegeEscalation: false
      nodeSelector:
        kubernetes.io/os: linux
      restartPolicy: OnFailure
      securityContext:
        fsGroup: 2000
        runAsNonRoot: true
        runAsUser: 2000
      serviceAccountName: ingress-nginx-admission

---
# --- Job: Patch Webhook Configuration ---
# Job chạy 1 lần để inject CA bundle vào ValidatingWebhookConfiguration
# để Kubernetes API server tin tưởng webhook certificate
apiVersion: batch/v1
kind: Job
metadata:
  labels:
    app.kubernetes.io/component: admission-webhook
    app.kubernetes.io/instance: ingress-nginx
    app.kubernetes.io/name: ingress-nginx
    app.kubernetes.io/part-of: ingress-nginx
    app.kubernetes.io/version: 1.8.1
  name: ingress-nginx-admission-patch
  namespace: ingress-nginx
spec:
  template:
    metadata:
      labels:
        app.kubernetes.io/component: admission-webhook
        app.kubernetes.io/instance: ingress-nginx
        app.kubernetes.io/name: ingress-nginx
        app.kubernetes.io/part-of: ingress-nginx
        app.kubernetes.io/version: 1.8.1
      name: ingress-nginx-admission-patch
    spec:
      containers:
        - args:
            - patch
            - --webhook-name=ingress-nginx-admission
            - --namespace=$(POD_NAMESPACE)
            - --patch-mutating=false
            - --secret-name=ingress-nginx-admission
            - --patch-failure-policy=Fail
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          image: registry.k8s.io/ingress-nginx/kube-webhook-certgen:v20230407@sha256:543c40fd093964bc9ab509d3e791f9989963021f1e9e4c9c7b6700b02bfb227b
          imagePullPolicy: IfNotPresent
          name: patch
          securityContext:
            allowPrivilegeEscalation: false
      nodeSelector:
        kubernetes.io/os: linux
      restartPolicy: OnFailure
      securityContext:
        fsGroup: 2000
        runAsNonRoot: true
        runAsUser: 2000
      serviceAccountName: ingress-nginx-admission

---
# --- IngressClass ---
# Đăng ký IngressClass "nginx" để các Ingress resources
# có thể reference: ingressClassName: nginx
# Một cluster có thể có nhiều IngressClass (nginx, traefik, etc.)
apiVersion: networking.k8s.io/v1
kind: IngressClass
metadata:
  labels:
    app.kubernetes.io/component: controller
    app.kubernetes.io/instance: ingress-nginx
    app.kubernetes.io/name: ingress-nginx
    app.kubernetes.io/part-of: ingress-nginx
    app.kubernetes.io/version: 1.8.1
  name: nginx
spec:
  controller: k8s.io/ingress-nginx  # Controller class phải khớp với --controller-class arg

---
# --- ValidatingWebhookConfiguration ---
# Cấu hình webhook để Kubernetes API server validate mọi
# Ingress resource trước khi apply. Giúp phát hiện lỗi cấu hình
# sớm (ví dụ: sai cú pháp annotation, conflict rules).
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  labels:
    app.kubernetes.io/component: admission-webhook
    app.kubernetes.io/instance: ingress-nginx
    app.kubernetes.io/name: ingress-nginx
    app.kubernetes.io/part-of: ingress-nginx
    app.kubernetes.io/version: 1.8.1
  name: ingress-nginx-admission
webhooks:
  - admissionReviewVersions:
      - v1
    clientConfig:
      service:
        name: ingress-nginx-controller-admission
        namespace: ingress-nginx
        path: /networking/v1/ingresses
    failurePolicy: Fail  # Nếu webhook không khả dụng → từ chối ingress (an toàn)
    matchPolicy: Equivalent
    name: validate.nginx.ingress.kubernetes.io
    rules:
      - apiGroups: [networking.k8s.io]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]  # Validate khi tạo mới hoặc cập nhật Ingress
        resources: [ingresses]
    sideEffects: None
