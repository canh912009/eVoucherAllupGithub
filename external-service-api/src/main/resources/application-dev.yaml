      hibernate:
        show_sql: true
        format_sql: true
  jackson:
    time-zone=: Asia/Ho_Chi_Minh

servers:
  admin-api: ${ADMIN_API_URL:http://192.168.105.34:8080/}
  file-upload-api: ${FILE_UPLOAD_API_URL:http://192.168.105.149:4000}